<h2>Statistics</h2>

@if (statistics$ | async; as statistics) {
<div>Total Songs: {{ statistics.TotalSongs }}</div>

<div>Total Plays: {{ statistics.TotalPlays }}</div>

<div>
  Time spend listening: {{ statistics.TotalPlayTime | secondsToString }}
</div>

<div>Total Artists: {{ statistics.TotalArtists }}</div>

<div>Total Albums: {{ statistics.TotalAlbums }}</div>
}
