<h2>Top Artists</h2>

@if (artists$ | async; as artists) {
<moreloja-cover-banner [viewModels]="artists"></moreloja-cover-banner>
}

<h2>Top Albums</h2>

@if (albums$ | async; as albums) {
<moreloja-cover-banner [viewModels]="albums"></moreloja-cover-banner>
}

<h2>Top Songs</h2>

@if (songs()) {
<moreloja-cover-banner [viewModels]="songs()"></moreloja-cover-banner>
}
