@if (isLoggedIn() === true) {
<input
  #file
  type="file"
  (change)="onFileSelected($event)"
  accept=".jpg, .jpeg, .png, .webp"
/>
@if (url$ | async; as url) {
<img
  (click)="file.click()"
  class="cover-image"
  loading="lazy"
  src="pictrs/image/process.webp?src={{ url }}&resize={{ size() }}"
/>
} @if (error$ | async; as error) {
<div class="error-hint">
  {{ error }}
</div>
} } @else { @if (url$ | async; as url) {
<img
  class="cover-image"
  loading="lazy"
  src="pictrs/image/process.webp?src={{ url }}&resize={{ size() }}"
/>
} }
