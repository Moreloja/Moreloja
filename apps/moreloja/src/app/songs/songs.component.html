<h2>Last Songs</h2>

<moreloja-pagination
  [page]="page()"
  [totalPages]="totalPages.value()"
  (pageChange)="onPageChange($event)"
/>

<div class="songs-container">
  @for (song of songs.value().songs; track song) {
    <div>
      <moreloja-song-card [song]="song"></moreloja-song-card>
    </div>
  }
</div>

<moreloja-pagination
  [page]="page()"
  [totalPages]="totalPages.value()"
  (pageChange)="onPageChange($event)"
/>
