<h2>Last Songs</h2>

@if (page$ | async; as page) {
<moreloja-pagination
  [page]="page"
  (pageChange)="onPageChange($event)"
></moreloja-pagination>
} @if (songs$ | async; as songs) {
<div class="songs-container">
  @for (song of songs.songs; track song) {
  <div>
    <moreloja-song-card [song]="song"></moreloja-song-card>
  </div>
  }
</div>
} @if (page$ | async; as page) {
<moreloja-pagination
  [page]="page"
  (pageChange)="onPageChange($event)"
></moreloja-pagination>
}
